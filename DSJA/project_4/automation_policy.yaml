schemaVersion: p4-canary-automation-v1

maxAutoRepairIterationsPerTier: 3
maxCanaryRunsPerScope: 2

allowedBranchPrefixes:
  - agent/p4-a1-canary-
  - integration/p4-canary-

allowedWriteRoots:
  - crawl/
  - integration/
  - shared/contracts/canary_automation/
  - reports/

requiredA1HandoffArtifacts:
  - canary_plan.json
  - approval_binding.json
  - request_attempt.jsonl
  - request_response_manifest.jsonl
  - checkpoint_manifest.json
  - raw_object_manifest.jsonl
  - index_results.parquet
  - detail_results.parquet
  - asset_results.parquet
  - canary_coverage.csv
  - kill_switch_events.jsonl
  - quarantine_manifest.jsonl
  - stage_manifest.json
  - stage_metrics.json
  - stage_quality.csv
  - CHECKSUMS.sha256

requiredA3AcceptanceArtifacts:
  - P4_CANARY_ACCEPTANCE_*.md
  - P4_CANARY_GATE_STATUS_*.csv
  - P4_CANARY_SCOPE_ESCALATION_DECISION_*.json

requiredA5AuditArtifacts:
  - P4_A5_CANARY_AUDIT_*.md
  - P4_A5_CANARY_GATE_STATUS_*.csv
  - EVIDENCE_MANIFEST_*.sha256

canaryTierDefinitions:
  TIER0:
    executionMode: FIXTURE_ONLY
    networkAllowed: false
    approvalArtifactRequired: false
    nextGate: TIER1_USER_APPROVAL
  TIER1:
    executionMode: INDEX_CANARY
    networkAllowedOnlyWithApproval: true
    detailAllowed: false
    assetAllowed: false
    nextGate: TIER2_USER_APPROVAL
  TIER2:
    executionMode: DETAIL_CANARY
    networkAllowedOnlyWithApproval: true
    assetAllowed: false
    externalAtsAllowed: false
    nextGate: TIER3_USER_APPROVAL
  TIER3:
    executionMode: LINKAREER_ASSET_CANARY
    networkAllowedOnlyWithApproval: true
    externalAtsAllowed: false
    nextGate: TIER4_USER_APPROVAL
  TIER4:
    executionMode: REPRESENTATIVE_CANARY
    networkAllowedOnlyWithApproval: true
    approvedStrataRequired: true
    a5AuditRequired: true
    nextGate: M2_FULL_USER_APPROVAL

approvalSchemaVersion: p4-canary-approval-v1
sourcePolicySchemaVersion: p4-linkareer-source-policy-v1

networkPolicy:
  allowNetworkWithoutApproval: false
  allowExternalAts: false
  allowBrowserAutomation: false
  allowFullM2Automation: false

scopeEscalation:
  requiresNewApprovalArtifact: true
  requiresA5ForTier4: true
  requiresA5ForM2: true

budgetExhaustionPolicy:
  stopAutomaticPatch: true
  stopScopeEscalation: true
  requireHumanDecision: true
