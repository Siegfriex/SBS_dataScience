rules:
  naming: camelCase
  crossSchemaForeignKeys: forbidden
  timestampTimezone: Asia/Seoul
  rq1PrimaryCountKey: canonicalPostingId
  rq1PreDedupCountKey: postingId
  reservedFields:
    highDemandScore:
      requiredValue: null
      while: scoreStatus = reserved
  careerMonths:
    E2: 12 <= minCareerMonths AND minCareerMonths <= 35
    E3: minCareerMonths >= 36 OR explicitCareerFlag = true
  keyContract:
    algorithm: SHA-256
    encoding: UTF-8
    separator: '|'
    truncationHexChars: 20
    postingId: PST_ + sha256(sourceName|sourcePostingId)[:20]
    rawPostingId: RAW_ + sha256(sourceName|sourcePostingId|rawSha256)[:20]
    trackId: TRK_ + sha256(postingId|trackIndex)[:20]
    sectionId: SEC_ + sha256(trackId|sectionOrder)[:20]
    requirementId: REQ_ + sha256(sectionId|requirementType|normalizedEvidence)[:20]
    matchId: NMT_ + sha256(trackId|ncsUnitCode|mappingBasis|evidenceHash)[:20]
  eligibility:
    postingEligibleFlag: confirmed recruit posting AND usable postedAt; excludes dedup and body length
    rq1EligibleFlag: postingEligibleFlag AND resolved entry/intern presence
    rq2EligibleFlag: eligible track AND resolved track split AND required/preferred boundary
    ncsEligibleFlag: rq2EligibleFlag AND defensible duty/task context
    canonicalRecordFlag: canonical record within dedup group; independent of eligibility
  sourcePolicyGate:
    pass: robotsStatus != restricted AND termsStatus IN [reviewedConditional, permissionGranted, permitted] AND transparentClientVerified
      = true AND collectionBlocked = false AND clientAccessMode != impersonatedOnly
    emptyEvidence: NOT_EVALUATED
    impersonatedOnly: REVIEW_REQUIRED
