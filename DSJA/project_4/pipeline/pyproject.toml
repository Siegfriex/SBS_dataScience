[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbs-p4-pipeline"
version = "0.1.0"
description = "P4 Linkareer/NCS normalization, warehouse, mart, and analysis pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "jsonschema>=4.20",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
