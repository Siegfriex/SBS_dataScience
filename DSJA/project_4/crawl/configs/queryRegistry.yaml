    httpMethod: GET
    frontendBuildId: linkareer-client-1785976285032
    discoveredAt: "2026-08-06"
    lastVerifiedAt: "2026-08-06"
    responseSchemaVersion: "v1"
    activeFlag: true
    verificationStatus: verified
    note: >
      totalCount-only aggregate for a filterBy/rangeBy combination. Useful as a
      completeness cross-check, but its rangeBy (recruitStartAt + recruitCloseAt,
      both windows) combination semantics (AND vs OR) is NOT yet disambiguated —
      see APQ_DATE_SEMANTICS.md §3 (unresolved item).
