[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbs-datascience"
version = "0.1.0"
description = "SBS data science notebooks and exercises"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "plotly>=5.24",
  "openpyxl>=3.1",
  "statsmodels>=0.14",
  "jupyterlab>=4.2",
  "notebook>=7.2",
  "ipykernel>=6.29",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
  "torchvision>=0.19",
  "torchaudio>=2.4",
  "keras>=3.5",
  "tensorflow[and-cuda]>=2.17",
]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"
